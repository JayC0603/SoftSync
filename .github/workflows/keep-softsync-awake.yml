name: SoftSync health check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-softsync-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping SoftSync health endpoint
        shell: bash
        run: |
          set -euo pipefail
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          # Retry transient cold starts before reporting an unhealthy deployment.
          for attempt in 1 2 3 4; do
            echo "Health request ${attempt}/4 at $(date -u +%FT%TZ)"
            if curl --fail --silent --show-error --location \
              --connect-timeout 15 --max-time 60 \
              --header "Cache-Control: no-cache" \
              --user-agent "SoftSync-Keepalive/1.1" \
              --output "$response_file" \
              "https://softsync.id.vn/health?keepalive=$(date +%s)"; then
              if python3 -c 'import json, sys; payload = json.load(open(sys.argv[1])); sys.exit(0 if payload.get("status") == "ok" else 1)' "$response_file"; then
                echo "SoftSync health check passed."
                exit 0
              fi
            fi
            if [ "$attempt" -lt 4 ]; then sleep 15; fi
          done
          echo "::error::SoftSync did not return a healthy JSON response. Check Vercel logs."
          exit 1
