services:
  - type: web
    name: softsync
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./SoftSync-main/SoftSync.Presentation/Dockerfile
    dockerContext: ./SoftSync-main
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: softsync-db
          property: connectionString
      - key: FRONTEND_ORIGINS
        sync: false
      - key: BootstrapAdmin__Email
        sync: false
      - key: BootstrapAdmin__Password
        sync: false
      - key: CvIntegration__FrontendUrl
        fromService:
          type: web
          name: softsync-cv
          property: host
      - key: CvIntegration__ApiBaseUrl
        fromService:
          type: web
          name: softsync-cv-api
          property: host
      - key: CvIntegration__SharedSecret
        sync: false
      - key: CvIntegration__Issuer
        value: softsync

  - type: web
    name: softsync-cv
    runtime: node
    plan: free
    region: singapore
    rootDir: ./SoftSync-main/SoftSync.Next
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: SOFTSYNC_APP_URL
        fromService:
          type: web
          name: softsync
          property: host
      - key: BACKEND_URL
        fromService:
          type: web
          name: softsync
          property: host
      - key: CV_API_URL
        fromService:
          type: web
          name: softsync-cv-api
          property: host

  - type: web
    name: softsync-cv-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./SoftSync-main/CvBackend/Dockerfile
    dockerContext: ./SoftSync-main/CvBackend
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: softsync-cv-db
          property: connectionString
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: softsync-cv-ai
          property: host
      - key: SOFTSYNC_SHARED_SECRET
        sync: false
      - key: SOFTSYNC_ISSUER
        value: softsync
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CAREERVIET_MOCK_ENABLED
        value: "true"
      - key: VIETNAMWORKS_MOCK_ENABLED
        value: "true"

  - type: web
    name: softsync-cv-ai
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./SoftSync-main/CvAi/Dockerfile
    dockerContext: ./SoftSync-main/CvAi
    healthCheckPath: /api/v1/health
    envVars:
      - key: AI_DEVICE
        value: cpu
      - key: TORCH_NUM_THREADS
        value: "2"

databases:
  - name: softsync-db
    plan: free
    region: singapore
    databaseName: softsync
    user: softsync
    ipAllowList: []
  - name: softsync-cv-db
    plan: free
    region: singapore
    databaseName: cv
    user: cv
    ipAllowList: []
