<style>

.score .tot{background:var(--acc2)}.score .tot b{color:var(--acc)}

<script>/*
 * rule-engine.js — Bộ sinh quy tắc cho game "Luật Ẩn" (Hidden Rule Lab)
 *
 * Chạy được cả trong trình duyệt (window.RuleEngine) lẫn Node (require).
 * Không phụ thuộc thư viện ngoài, không dùng AI.
 *
 * Ý tưởng:
 *  - Mỗi quy tắc = (family, params). Family là một "mẫu" có tham số, ví dụ
 *    all_gt{k:12} = "Cả ba số đều lớn hơn 12".
 *  - Miền giá trị: bộ ba số nguyên trong [1, 30] -> chỉ có 27.000 bộ ba,
 *    nên có thể liệt kê TOÀN BỘ để kiểm tra chất lượng quy tắc chính xác.
 *  - Mỗi quy tắc sinh ra đều qua bộ lọc: tỉ lệ thỏa hợp lý, không trùng
 *    về ngữ nghĩa với quy tắc khác, có "giả thuyết mồi" (decoy) cho ví dụ mẫu.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.RuleEngine = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  /* ------------------------------------------------------------------ */
  /* 1. Miền giá trị & toàn bộ bộ ba                                     */
  /* ------------------------------------------------------------------ */
  const DOMAIN = Object.freeze({ min: 1, max: 30 });
  const SPAN = DOMAIN.max - DOMAIN.min + 1;
  const TOTAL = SPAN * SPAN * SPAN;
  const ALL = new Array(TOTAL);
  for (let i = 0; i < TOTAL; i++) {
    ALL[i] = [
      DOMAIN.min + Math.floor(i / (SPAN * SPAN)),
      DOMAIN.min + (Math.floor(i / SPAN) % SPAN),
      DOMAIN.min + (i % SPAN),
    ];
  }
  const indexOf = (t) =>
    ((t[0] - DOMAIN.min) * SPAN + (t[1] - DOMAIN.min)) * SPAN + (t[2] - DOMAIN.min);

  // Ngưỡng chất lượng (tỉ lệ bộ ba ngẫu nhiên thỏa quy tắc)
  const RATE = Object.freeze({ min: 0.1, max: 0.9, narrowMin: 0.01 });
  // Hai quy tắc / giả thuyết phải khác nhau ít nhất ngần này bộ ba (~1%)
  const MIN_DIFF = 270;

  /* ------------------------------------------------------------------ */
  /* 2. Tiện ích                                                         */
  /* ------------------------------------------------------------------ */
  function mulberry32(seed) {
    let t = seed >>> 0;
    return function () {
      t += 0x6d2b79f5;
      let r = Math.imul(t ^ (t >>> 15), 1 | t);
      r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
      return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
    };
  }
  const pick = (rng, arr) => arr[Math.floor(rng() * arr.length)];
  function shuffle(rng, arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  const range = (a, b) => {
    const r = [];
    for (let i = a; i <= b; i++) r.push(i);
    return r;
  };
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  const lowerFirst = (s) => s.charAt(0).toLowerCase() + s.slice(1);
  const isPrime = (n) => {
    if (n < 2) return false;
    for (let i = 2; i * i <= n; i++) if (n % i === 0) return false;
    return true;
  };
  const isSquare = (n) => Number.isInteger(Math.sqrt(n));
  const countWhere = (t, f) => (f(t[0]) ? 1 : 0) + (f(t[1]) ? 1 : 0) + (f(t[2]) ? 1 : 0);
  const max3 = (t) => Math.max(t[0], t[1], t[2]);
  const min3 = (t) => Math.min(t[0], t[1], t[2]);
  const POS = ['số thứ nhất', 'số thứ hai', 'số thứ ba'];

  function bitsOf(pred) {
    const b = new Uint8Array(TOTAL);
    for (let i = 0; i < TOTAL; i++) b[i] = pred(ALL[i]) ? 1 : 0;
    return b;
  }
  function countOnes(bits) {
    let c = 0;
    for (let i = 0; i < bits.length; i++) c += bits[i];
    return c;
  }
  // "Dấu vân tay" của quy tắc: hai quy tắc cùng chữ ký <=> giống hệt về ngữ nghĩa
  function sigOf(bits) {
    let h1 = 0x811c9dc5;
    let h2 = 0x9e3779b9;
    let c = 0;
    for (let i = 0; i < bits.length; i++) {
      const b = bits[i];
      c += b;
      h1 ^= b + 1;
      h1 = Math.imul(h1, 16777619);
      h2 ^= (b << 1) + (i % 7) + 1;
      h2 = Math.imul(h2, 2246822519);
    }
    return (h1 >>> 0).toString(16) + '-' + (h2 >>> 0).toString(16) + '-' + c;
  }
  function countDiff(b1, b2, mode) {
    // mode: 'a&!b' | 'b&!a' | 'a&b' | 'xor' | 'inter'
    let c = 0;
    for (let i = 0; i < b1.length; i++) {
      const a = b1[i], b = b2[i];
      if (mode === 'a&!b') c += a & (1 - b);
      else if (mode === 'b&!a') c += b & (1 - a);
      else if (mode === 'xor') c += a ^ b;
      else c += a & b;
    }
    return c;
  }

  /* ------------------------------------------------------------------ */
  /* 3. Thư viện mẫu quy tắc (family)                                    */
  /* ------------------------------------------------------------------ */
  const REG = {};
  function def(family, level, o) {
    REG[family] = Object.assign({ family, level, narrow: false }, o);
  }

  /* ---- Màn 1: một điều kiện đơn giản ---- */
  def('inc', 1, {
    variants: () => [{}],
    test: () => (t) => t[0] < t[1] && t[1] < t[2],
    text: () => 'Ba số tăng dần (mỗi số lớn hơn số đứng trước)',
  });
  def('dec', 1, {
    variants: () => [{}],
    test: () => (t) => t[0] > t[1] && t[1] > t[2],
    text: () => 'Ba số giảm dần (mỗi số nhỏ hơn số đứng trước)',
  });
  def('extreme', 1, {
    variants: () => {
      const v = [];
      for (const pos of [0, 2]) for (const kind of ['max', 'min']) v.push({ pos, kind });
      return v;
    },
    test: ({ pos, kind }) => {
      const o1 = (pos + 1) % 3, o2 = (pos + 2) % 3;
      return kind === 'max'
        ? (t) => t[pos] > t[o1] && t[pos] > t[o2]
        : (t) => t[pos] < t[o1] && t[pos] < t[o2];
    },
    text: ({ pos, kind }) => `${cap(POS[pos])} là số ${kind === 'max' ? 'lớn' : 'nhỏ'} nhất`,
  });
  def('all_gt', 1, {
    variants: () => range(1, 29).map((k) => ({ k })),
    test: ({ k }) => (t) => t[0] > k && t[1] > k && t[2] > k,
    text: ({ k }) => `Cả ba số đều lớn hơn ${k}`,
  });
  def('all_lt', 1, {
    variants: () => range(2, 30).map((k) => ({ k })),
    test: ({ k }) => (t) => t[0] < k && t[1] < k && t[2] < k,
    text: ({ k }) => `Cả ba số đều nhỏ hơn ${k}`,
  });
  def('any_gt', 1, {
    variants: () => range(1, 29).map((k) => ({ k })),
    test: ({ k }) => (t) => max3(t) > k,
    text: ({ k }) => `Có ít nhất một số lớn hơn ${k}`,
  });
  def('any_lt', 1, {
    variants: () => range(2, 30).map((k) => ({ k })),
    test: ({ k }) => (t) => min3(t) < k,
    text: ({ k }) => `Có ít nhất một số nhỏ hơn ${k}`,
  });
  def('pos_cmp', 1, {
    variants: () => {
      const v = [];
      for (let pos = 0; pos < 3; pos++)
        for (const dir of ['gt', 'lt']) for (let k = 3; k <= 28; k++) v.push({ pos, dir, k });
      return v;
    },
    test: ({ pos, dir, k }) => (dir === 'gt' ? (t) => t[pos] > k : (t) => t[pos] < k),
    text: ({ pos, dir, k }) => `${cap(POS[pos])} ${dir === 'gt' ? 'lớn' : 'nhỏ'} hơn ${k}`,
  });
  def('sum_lt', 1, {
    variants: () => range(10, 85).map((k) => ({ k })),
    test: ({ k }) => (t) => t[0] + t[1] + t[2] < k,
    text: ({ k }) => `Tổng ba số nhỏ hơn ${k}`,
  });
  def('sum_gt', 1, {
    variants: () => range(10, 85).map((k) => ({ k })),
    test: ({ k }) => (t) => t[0] + t[1] + t[2] > k,
    text: ({ k }) => `Tổng ba số lớn hơn ${k}`,
  });

  /* ---- Màn 2: tính chất của số ---- */
  def('all_even', 2, {
    variants: () => [{}],
    test: () => (t) => t.every((x) => x % 2 === 0),
    text: () => 'Cả ba số đều là số chẵn',
  });
  def('all_odd', 2, {
    variants: () => [{}],
    test: () => (t) => t.every((x) => x % 2 === 1),
    text: () => 'Cả ba số đều là số lẻ',
  });
  def('mixed_parity', 2, {
    variants: () => [{}],
    test: () => (t) => {
      const e = countWhere(t, (x) => x % 2 === 0);
      return e > 0 && e < 3;
    },
    text: () => 'Ba số có cả số chẵn lẫn số lẻ',
  });
  def('exact_even', 2, {
    variants: () => [{ e: 1 }, { e: 2 }],
    test: ({ e }) => (t) => countWhere(t, (x) => x % 2 === 0) === e,
    text: ({ e }) => `Có đúng ${e} số chẵn trong ba số`,
  });
  def('sum_mod', 2, {
    variants: () => {
      const v = [];
      for (let m = 2; m <= 9; m++) for (let r = 0; r < m; r++) v.push({ m, r });
      return v;
    },
    test: ({ m, r }) => (t) => (t[0] + t[1] + t[2]) % m === r,
    text: ({ m, r }) =>
      m === 2
        ? r === 0 ? 'Tổng ba số là số chẵn' : 'Tổng ba số là số lẻ'
        : r === 0 ? `Tổng ba số chia hết cho ${m}` : `Tổng ba số chia cho ${m} dư ${r}`,
  });
  def('any_multiple', 2, {
    variants: () => range(3, 16).map((m) => ({ m })),
    test: ({ m }) => (t) => t[0] % m === 0 || t[1] % m === 0 || t[2] % m === 0,
    text: ({ m }) => `Có ít nhất một số chia hết cho ${m}`,
  });
  def('exact_multiple', 2, {
    variants: () => {
      const v = [];
      for (let m = 3; m <= 8; m++) for (const j of [1, 2]) v.push({ m, j });
      return v;
    },
    test: ({ m, j }) => (t) => countWhere(t, (x) => x % m === 0) === j,
    text: ({ m, j }) => `Có đúng ${j} số chia hết cho ${m}`,
  });
  def('prod_multiple', 2, {
    variants: () => range(2, 12).map((m) => ({ m })),
    test: ({ m }) => (t) => (t[0] * t[1] * t[2]) % m === 0,
    text: ({ m }) => `Tích ba số chia hết cho ${m}`,
  });
  def('prime_count', 2, {
    variants: () => [{ k: 1 }, { k: 2 }],
    test: ({ k }) => (t) => countWhere(t, isPrime) >= k,
    text: ({ k }) => (k === 1 ? 'Có ít nhất một số nguyên tố' : 'Có ít nhất hai số nguyên tố'),
  });
  def('any_square', 2, {
    variants: () => [{}],
    test: () => (t) => t.some(isSquare),
    text: () => 'Có ít nhất một số chính phương (1, 4, 9, 16, 25)',
  });
  def('two_digit', 2, {
    variants: () => [{ j: 1 }, { j: 2 }, { j: 3 }],
    test: ({ j }) => (t) => countWhere(t, (x) => x >= 10) === j,
    text: ({ j }) => (j === 3 ? 'Cả ba số đều có hai chữ số' : `Có đúng ${j} số có hai chữ số`),
  });
  def('pair_same_residue', 2, {
    variants: () => range(3, 10).map((m) => ({ m })),
    test: ({ m }) => (t) => t[0] % m === t[1] % m || t[1] % m === t[2] % m || t[0] % m === t[2] % m,
    text: ({ m }) => `Có ít nhất hai số cho cùng số dư khi chia cho ${m}`,
  });
  def('ac_same_residue', 2, {
    variants: () => range(2, 10).map((m) => ({ m })),
    test: ({ m }) => (t) => t[0] % m === t[2] % m,
    text: ({ m }) => `Số thứ nhất và số thứ ba cho cùng số dư khi chia cho ${m}`,
  });
  def('last_digit', 2, {
    variants: () => range(0, 9).map((r) => ({ r })),
    test: ({ r }) => (t) => t.some((x) => x % 10 === r),
    text: ({ r }) => `Có ít nhất một số có chữ số hàng đơn vị là ${r}`,
  });
  def('max_multiple', 2, {
    variants: () => range(2, 8).map((m) => ({ m })),

  def('min_parity', 2, {
    variants: () => [{ p: 0 }, { p: 1 }],
    test: ({ p }) => (t) => min3(t) % 2 === p,
    text: ({ p }) => `Số nhỏ nhất là số ${p === 0 ? 'chẵn' : 'lẻ'}`,
  });
  def('range_mod', 2, {
    variants: () => range(2, 8).map((m) => ({ m })),
    test: ({ m }) => (t) => (max3(t) - min3(t)) % m === 0,
    text: ({ m }) => `Hiệu giữa số lớn nhất và số nhỏ nhất chia hết cho ${m}`,
  });

  /* ---- Màn 3: quan hệ giữa các vị trí ---- */
  def('mid_extreme', 3, {
    variants: () => [{ kind: 'max' }, { kind: 'min' }],
    test: ({ kind }) =>
      kind === 'max'
        ? (t) => t[1] > t[0] && t[1] > t[2]
        : (t) => t[1] < t[0] && t[1] < t[2],

  def('mid_between', 3, {

  def('mid_avg', 3, {

      dir === 'lt' ? (t) => 2 * t[1] < t[0] + t[2] : (t) => 2 * t[1] > t[0] + t[2],
    text: ({ dir }) =>

  });
  def('third_sum', 3, {

  def('gap', 3, {

  def('spread', 3, {

    },
    test: ({ dir, k }) =>
      dir === 'lt' ? (t) => max3(t) - min3(t) < k : (t) => max3(t) - min3(t) > k,
    text: ({ dir, k }) =>
      `Chênh lệch giữa số lớn nhất và số nhỏ nhất ${dir === 'lt' ? 'nhỏ' : 'lớn'} hơn ${k}`,
  });
  // Các quy tắc "hẹp" (khó tìm bằng thử ngẫu nhiên, cần thử có hệ thống)
  def('ap', 3, {
    narrow: true,
    variants: () => [{}],
    test: () => (t) => t[1] - t[0] === t[2] - t[1],
    text: () => 'Ba số cách đều nhau (số thứ hai là trung bình cộng của hai số kia)',
  });
  def('sum_eq', 3, {
    narrow: true,
    variants: () => [{}],
    test: () => (t) => t[2] === t[0] + t[1],

  });
  def('double12', 3, {
    narrow: true,
    variants: () => [{}],
    test: () => (t) => t[1] === 2 * t[0],

  });
  def('double23', 3, {
    narrow: true,
    variants: () => [{}],
    test: () => (t) => t[2] === 2 * t[1],
    text: () => 'Số thứ ba gấp đôi số thứ hai',
  });
  def('a_eq_c', 3, {
    narrow: true,
    variants: () => [{}],
    test: () => (t) => t[0] === t[2],
    text: () => 'Số thứ nhất bằng số thứ ba',
  });
  def('step', 3, {
    narrow: true,
    variants: () => {
      const v = [];
      for (const from of [0, 1]) for (let d = 1; d <= 10; d++) v.push({ from, d });
      return v;
    },
    test: ({ from, d }) => (t) => t[from + 1] - t[from] === d,
    text: ({ from, d }) =>
      `${cap(POS[from + 1])} hơn ${POS[from]} đúng ${d} đơn vị`,
  });

  /* ------------------------------------------------------------------ */
  /* 4. Giả thuyết "mồi" (decoy) — thứ người chơi dễ đoán sai từ ví dụ   */
  /* ------------------------------------------------------------------ */
  const DECOY_DEFS = [
    { id: 'inc', text: 'Ba số tăng dần', test: (t) => t[0] < t[1] && t[1] < t[2] },
    { id: 'dec', text: 'Ba số giảm dần', test: (t) => t[0] > t[1] && t[1] > t[2] },
    { id: 'double', text: 'Mỗi số gấp đôi số đứng trước', test: (t) => t[1] === 2 * t[0] && t[2] === 2 * t[1] },
    { id: 'ap', text: 'Ba số cách đều nhau (cấp số cộng)', test: (t) => t[1] - t[0] === t[2] - t[1] },
    { id: 'step2', text: 'Mỗi số hơn số đứng trước đúng 2 đơn vị', test: (t) => t[1] - t[0] === 2 && t[2] - t[1] === 2 },
    { id: 'consec', text: 'Ba số nguyên liên tiếp', test: (t) => t[1] === t[0] + 1 && t[2] === t[1] + 1 },
    { id: 'all_even', text: 'Cả ba số đều là số chẵn', test: (t) => t.every((x) => x % 2 === 0) },
    { id: 'all_odd', text: 'Cả ba số đều là số lẻ', test: (t) => t.every((x) => x % 2 === 1) },
    { id: 'mult', text: 'Số thứ hai và số thứ ba lần lượt gấp 2 và 3 lần số thứ nhất', test: (t) => t[1] === 2 * t[0] && t[2] === 3 * t[0] },
    { id: 'small', text: 'Cả ba số đều nhỏ hơn 10', test: (t) => t.every((x) => x < 10) },
  ];
  const DECOYS = DECOY_DEFS.map((d) => {
    const bits = bitsOf(d.test);
    return Object.assign({}, d, { bits, sig: sigOf(bits), rate: countOnes(bits) / TOTAL });
  });
  const DECOY_BY_ID = {};
  DECOYS.forEach((d) => (DECOY_BY_ID[d.id] = d));

  /* ------------------------------------------------------------------ */
  /* 5. Dựng hàm kiểm tra từ dữ liệu JSON                                */
  /* ------------------------------------------------------------------ */
  function buildPredicate(rule) {
    if (rule.family === 'combo') {
      const { op, a, b } = rule.params;
      const pa = REG[a.family].test(a.params);
      const pb = REG[b.family].test(b.params);
      if (op === 'AND') return (t) => pa(t) && pb(t);
      if (op === 'OR') return (t) => pa(t) || pb(t);
      return (t) => !pa(t) || pb(t); // IF: nếu a thì b
    }
    const T = REG[rule.family];
    if (!T) throw new Error('Không biết family: ' + rule.family);
    return T.test(rule.params);
  }
  const evaluate = (rule, triple) => buildPredicate(rule)(triple);
  const inDomain = (t) =>
    Array.isArray(t) && t.length === 3 &&
    t.every((x) => Number.isInteger(x) && x >= DOMAIN.min && x <= DOMAIN.max);

  /* ------------------------------------------------------------------ */
  /* 6. Sinh bộ đề                                                       */
  /* ------------------------------------------------------------------ */
  // Chọn đều theo family (round-robin) để không có family nào lấn át
  function balancedSelect(cands, n, rng) {
    const groups = {};
    for (const c of shuffle(rng, cands)) (groups[c.family] = groups[c.family] || []).push(c);
    const fams = shuffle(rng, Object.keys(groups));
    const out = [];
    let progressed = true;
    while (out.length < n && progressed) {
      progressed = false;
      for (const f of fams) {
        if (out.length >= n) break;
        if (groups[f].length) {
          out.push(groups[f].pop());
          progressed = true;
        }
      }
    }
    return out;
  }

  // Chọn ví dụ mẫu thỏa quy tắc VÀ thỏa một giả thuyết mồi dễ đoán sai
  function chooseSample(rbits, rsig, rng) {
    const elig = [];
    for (const d of DECOYS) {
      if (d.sig === rsig) continue;
      if (countDiff(rbits, d.bits, 'xor') < MIN_DIFF) continue;
      if (countDiff(rbits, d.bits, 'inter') === 0) continue;
      elig.push(d);
    }
    if (elig.length) {
      elig.sort((x, y) => x.rate - y.rate); // mồi càng "hẹp" càng cuốn hút
      const d = elig[Math.floor(Math.pow(rng(), 1.6) * elig.length)];
      const both = [];
      for (let i = 0; i < TOTAL; i++) if (rbits[i] && d.bits[i]) both.push(i);
      return { sample: ALL[both[Math.floor(rng() * both.length)]].slice(), decoy: d };
    }
    const ones = [];
    for (let i = 0; i < TOTAL; i++) if (rbits[i]) ones.push(i);
    return { sample: ALL[ones[Math.floor(rng() * ones.length)]].slice(), decoy: null };
  }

  function makeEntry(level, family, params, phrase, rate, picked, note) {
    const text = phrase + '.';
    const e = {
      id: '',
      level,
      family,
      params,
      text,
      rate: Math.round(rate * 1000) / 1000,
      sample: picked.sample,
      decoy: picked.decoy ? { id: picked.decoy.id, text: picked.decoy.text } : null,
      explain: picked.decoy
        ? `Ví dụ mẫu ${picked.sample.join(', ')} cũng khớp với giả thuyết “${picked.decoy.text}”, nhưng quy tắc thật là: ${text}`
        : `Quy tắc thật là: ${text}`,
    };
    if (note) e.note = note;
    return e;
  }

  function generateAll(opts) {
    opts = opts || {};
    const seed = opts.seed == null ? 20261025 : opts.seed;
    const perLevel = opts.perLevel || 120;
    const rng = mulberry32(seed);
    const seen = new Set();
    const byLevel = { 1: [], 2: [], 3: [] };
    const bases = [];

    // 6.1 Liệt kê mọi biến thể của mọi mẫu, lọc theo chất lượng
    for (const fam of Object.keys(REG)) {
      const T = REG[fam];
      for (const p of T.variants()) {
        const bits = bitsOf(T.test(p));
        const rate = countOnes(bits) / TOTAL;
        const lo = T.narrow ? RATE.narrowMin : RATE.min;
        if (rate < lo || rate > RATE.max) continue;
        const sig = sigOf(bits);
        if (seen.has(sig)) continue; // trùng ngữ nghĩa với quy tắc khác
        seen.add(sig);
        const c = { family: fam, params: p, level: T.level, narrow: !!T.narrow, phrase: T.text(p), bits, rate, sig };
        bases.push(c);
        byLevel[T.level].push(c);
      }
    }

    const levels = { 1: [], 2: [], 3: [], 4: [] };
    const poolSizes = { 1: byLevel[1].length, 2: byLevel[2].length, 3: byLevel[3].length };

    // 6.2 Màn 1–3
    for (const L of [1, 2, 3]) {
      const chosen = balancedSelect(byLevel[L], perLevel, rng);
      for (const c of chosen) {
        const picked = chooseSample(c.bits, c.sig, rng);
        levels[L].push(makeEntry(L, c.family, c.params, c.phrase, c.rate, picked));
      }
    }

    // 6.3 Màn 4: ghép hai quy tắc (VÀ / HOẶC / NẾU...THÌ)
    const pool = bases.filter((c) => !c.narrow && c.rate >= 0.2 && c.rate <= 0.85);
    const famCount = {};
    const famCap = Math.ceil(perLevel * 0.2);
    const ops = ['AND', 'AND', 'AND', 'OR', 'OR', 'IF', 'IF'];
    let tries = 0;
    let comboPool = 0;
    while (levels[4].length < perLevel && tries < 600000) {
      tries++;
      const A = pick(rng, pool), B = pick(rng, pool);
      if (A.family === B.family) continue;
      if ((famCount[A.family] || 0) >= famCap || (famCount[B.family] || 0) >= famCap) continue;
      const op = pick(rng, ops);
      const bits = new Uint8Array(TOTAL);
      for (let i = 0; i < TOTAL; i++) {
        const a = A.bits[i], b = B.bits[i];
        bits[i] = op === 'AND' ? a & b : op === 'OR' ? a | b : (1 - a) | b;
      }
      const rate = countOnes(bits) / TOTAL;
      if (rate < RATE.min || rate > RATE.max) continue;
      // Hai vế phải thật sự đóng góp, không vế nào "nuốt" vế kia
      const aNotB = countDiff(A.bits, B.bits, 'a&!b');
      const bNotA = countDiff(A.bits, B.bits, 'b&!a');
      const ab = countDiff(A.bits, B.bits, 'inter');
      if (op === 'IF') {
        if (aNotB < 2 * MIN_DIFF || ab < MIN_DIFF) continue;
      } else if (aNotB < MIN_DIFF || bNotA < MIN_DIFF) continue;
      const sig = sigOf(bits);
      if (seen.has(sig)) continue;
      const picked = chooseSample(bits, sig, rng);
      if (!picked.decoy) continue; // màn 4 bắt buộc có giả thuyết mồi
      seen.add(sig);
      famCount[A.family] = (famCount[A.family] || 0) + 1;
      famCount[B.family] = (famCount[B.family] || 0) + 1;
      comboPool++;
      let phrase, note;
      if (op === 'AND') phrase = `Cả hai điều sau cùng đúng: ① ${lowerFirst(A.phrase)}; ② ${lowerFirst(B.phrase)}`;
      else if (op === 'OR') phrase = `Ít nhất một trong hai điều sau đúng: ① ${lowerFirst(A.phrase)}; ② ${lowerFirst(B.phrase)}`;
      else {
        phrase = `Nếu ${lowerFirst(A.phrase)} thì ${lowerFirst(B.phrase)}`;
        note = 'Lưu ý: khi vế “nếu” không xảy ra, bộ ba mặc nhiên được tính là Thỏa.';
      }
      levels[4].push(
        makeEntry(4, 'combo',
          { op, a: { family: A.family, params: A.params }, b: { family: B.family, params: B.params } },
          phrase, rate, picked, note)
      );
    }

    // 6.4 Đánh số, xáo trộn thứ tự
    for (const L of [1, 2, 3, 4]) {
      levels[L] = shuffle(rng, levels[L]);
      levels[L].forEach((r, i) => (r.id = `L${L}-${String(i + 1).padStart(3, '0')}`));
    }

    const familyCounts = {};
    for (const L of [1, 2, 3, 4]) {
      familyCounts[L] = {};
      for (const r of levels[L]) {
        if (r.family === 'combo') {
          familyCounts[L][r.params.op] = (familyCounts[L][r.params.op] || 0) + 1;
        } else familyCounts[L][r.family] = (familyCounts[L][r.family] || 0) + 1;
      }
    }

    return {
      meta: {
        game: 'Luật Ẩn',
        seed,
        perLevel,
        domain: DOMAIN,
        rateBounds: RATE,
        counts: { 1: levels[1].length, 2: levels[2].length, 3: levels[3].length, 4: levels[4].length },
        validBasePool: poolSizes,
        familyCounts,
      },
      levels,
    };
  }

  /* ------------------------------------------------------------------ */
  /* 7. Bộ ba kiểm tra cuối màn ("Chốt quy tắc")                         */
  /* ------------------------------------------------------------------ */
  // Trả về n bộ ba (cân bằng Thỏa / Không thỏa), gồm:
  //  - diagnostic: phân biệt quy tắc thật với giả thuyết mồi
  //  - boundary:   sát ranh giới (đổi ±1 một số là kết quả đảo ngược)
  //  - random:     ngẫu nhiên
  function makeFinalTest(rule, rng, n) {
    n = n || 10;
    rng = rng || Math.random;
    const pred = buildPredicate(rule);
    const decoy = rule.decoy ? DECOY_BY_ID[rule.decoy.id] : null;
    const sampleIdx = indexOf(rule.sample);
    const yes = [], no = [];
    for (let i = 0; i < TOTAL; i++) {
      if (i === sampleIdx) continue;
      (pred(ALL[i]) ? yes : no).push(ALL[i]);
    }
    const isBoundary = (t) => {
      const v = pred(t);
      for (let k = 0; k < 3; k++)
        for (const d of [-1, 1]) {
          const u = t.slice();
          u[k] += d;
          if (u[k] < DOMAIN.min || u[k] > DOMAIN.max) continue;
          if (pred(u) !== v) return true;
        }
      return false;
    };
    const used = new Set([rule.sample.join(',')]);
    function build(pool, want, answer, diagFilter) {
      const out = [];
      const fill = (filter, limit, kind) => {
        let got = 0;
        for (const t of shuffle(rng, pool)) {
          if (out.length >= want || got >= limit) break;
          const key = t.join(',');
          if (used.has(key) || !filter(t)) continue;
          used.add(key);
          out.push({ triple: t, answer, kind });
          got++;
        }
      };
      if (diagFilter) fill(diagFilter, 1, 'diagnostic');
      fill(isBoundary, 2, 'boundary');
      fill(() => true, want, 'random');
      return out;
    }
    const wantYes = Math.ceil(n / 2), wantNo = Math.floor(n / 2);
    const yesItems = build(yes, wantYes, true, decoy ? (t) => !decoy.test(t) : null);
    const noItems = build(no, wantNo, false, decoy ? (t) => decoy.test(t) : null);
    return shuffle(rng, yesItems.concat(noItems));
  }

  /* ------------------------------------------------------------------ */
  /* 8. Bốc đề cho một lượt chơi                                         */
  /* ------------------------------------------------------------------ */
  // seenIds: Set các id đã gặp gần đây (ví dụ lưu trong localStorage)
  function pickRules(data, seenIds, rng) {
    rng = rng || Math.random;
    seenIds = seenIds || new Set();
    const out = [];
    for (let L = 1; L <= 4; L++) {
      const all = data.levels[L];
      let pool = all.filter((r) => !seenIds.has(r.id));
      if (!pool.length) pool = all; // đã chơi hết thì cho lặp lại
      out.push(pick(rng, pool));
    }
    return out;
  }

  /* ------------------------------------------------------------------ */
  /* 9. Kiểm định dữ liệu                                                */
  /* ------------------------------------------------------------------ */
  function verifyData(data) {
    const problems = [];
    const ids = new Set();
    const sigs = new Map();
    const stats = { rules: 0, withDecoy: {}, rateBuckets: {} };
    for (const L of [1, 2, 3, 4]) {
      const list = data.levels[L];
      if (!list || !list.length) { problems.push(`Màn ${L} rỗng`); continue; }
      stats.withDecoy[L] = 0;
      for (const r of list) {
        stats.rules++;
        if (ids.has(r.id)) problems.push(`Trùng id ${r.id}`);
        ids.add(r.id);
        if (r.level !== L) problems.push(`${r.id}: sai level`);
        let pred;
        try { pred = buildPredicate(r); } catch (e) { problems.push(`${r.id}: ${e.message}`); continue; }
        if (!inDomain(r.sample)) problems.push(`${r.id}: ví dụ mẫu ngoài miền`);
        else if (!pred(r.sample)) problems.push(`${r.id}: ví dụ mẫu KHÔNG thỏa quy tắc`);
        const bits = bitsOf(pred);
        const rate = countOnes(bits) / TOTAL;
        if (Math.abs(rate - r.rate) > 0.0006) problems.push(`${r.id}: tỉ lệ lưu ${r.rate} ≠ tính lại ${rate.toFixed(4)}`);
        const sig = sigOf(bits);
        if (sigs.has(sig)) problems.push(`${r.id} trùng ngữ nghĩa với ${sigs.get(sig)}`);
        sigs.set(sig, r.id);
        if (r.decoy) {
          stats.withDecoy[L]++;
          const d = DECOY_BY_ID[r.decoy.id];
          if (!d) problems.push(`${r.id}: decoy không tồn tại`);
          else {
            if (!d.test(r.sample)) problems.push(`${r.id}: ví dụ mẫu không thỏa giả thuyết mồi`);
            if (d.sig === sig) problems.push(`${r.id}: giả thuyết mồi giống hệt quy tắc thật`);
          }

function pickEx(c,ok,n){
 const s=c.r.sample,dist=t=>Math.abs(t[0]-s[0])+Math.abs(t[1]-s[1])+Math.abs(t[2]-s[2]);
 const used=new Set([s.join(),...c.tries.map(x=>x.tr.join()),...c.hints.map(h=>h.tr.join()),...(c.free||[]).map(x=>x.join())]);
 let pool=E.ALL.filter(t=>!!c.pred(t)===ok&&!used.has(t.join()));
 pool=ok?E.shuffle(Math.random,pool).slice(0,40).sort((a,b)=>dist(b)-dist(a)):pool.sort((a,b)=>dist(a)-dist(b)).slice(0,8);
 const out=[];while(out.length<n&&pool.length)out.push(pool.splice(Math.floor(Math.random()*Math.min(pool.length,3)),1)[0].slice());
 return out;
}

  const r=rules[d.lv];
  S={phase:d.ph,lv:d.lv,rules,skins,res:d.res.map(x=>Object.assign({},x,{r:by[x.r],k:SKINS[x.k]}))};
  S.cur={r,pred:E.buildPredicate(r),skin:skins[d.lv],tries:d.cur.tries,hints:d.cur.hints||[],free:d.cur.free||[],note:d.cur.note||'',test:d.cur.test,ans:d.cur.ans||[]};
  render();return true;
 }catch(e){return false}
}
function introView(){
 const tot=Object.values(DATA.meta.counts).reduce((a,b)=>a+b,0),b=best();
 return `<header class="top"><b>🔎 Luật Ẩn</b></header>
 <section class="hero"><div class="tag">Rèn tư duy phản biện</div><h1>Luật Ẩn</h1>
 <p>Một quy tắc bí mật đang chấm điểm các bộ ba số. Bạn chỉ có ${MAXT} lượt thử để tìm ra nó — nhưng <b>cách bạn thử</b> mới là điều đáng học.</p>
 ${hasSave()?'<button class="b big" data-a="resume">▶ Tiếp tục ván đang chơi</button>':''}<button class="b pri big" data-a="start">Bắt đầu chơi →</button>${b?`<p class="sm">🏆 Điểm cao nhất của bạn: <b>${b}</b></p>`:''}</section>
 <div class="how">${[['👀','Xem ví dụ','Bạn được xem một bộ ba đã được duyệt.'],['🎯','Đoán rồi thử','Nhập một bộ ba, đoán trước kết quả, rồi xem hệ thống trả lời.'],['✅','Chốt quy tắc',`Phân loại ${NT} bộ ba mới để chứng minh bạn đã hiểu quy tắc.`]].map(x=>`<div class="card"><div class="ico">${x[0]}</div><h3>${x[1]}</h3><p class="mut sm">${x[2]}</p></div>`).join('')}</div>
 <section class="card"><h3>🎯 Luyện tập từng màn</h3><p class="mut sm">Chọn một màn để chơi riêng, không ảnh hưởng đến ván chính và điểm cao nhất.</p><div class="row">${LN.map((n,i)=>`<button class="b" data-a="prac" data-l="${i+1}">Màn ${i+1}<br><span class="sm mut">${n}</span></button>`).join('')}</div></section>
 <p class="mut sm c">4 màn, khó dần · mỗi lượt chơi bốc ngẫu nhiên từ ${tot} bộ đề nên lần nào cũng khác</p>`;
}
function playView(){
 const c=S.cur,k=c.skin,t=c.tries,left=MAXT-t.length,last=t[t.length-1],v=last?last.tr:['','',''],dis=left?'':'disabled';
 const verdict=last?`<div class="verdict ${last.res?'ok':'no'}" role="status"><div class="vi">${last.res?'✓':'✗'}</div><div><b>${last.res?k.y:k.x}</b><div class="sm">${last.sur?'⚡ Khác với dự đoán của bạn — đây là lúc học được nhiều nhất!':'Đúng như bạn dự đoán.'}</div></div></div>`:'';
 return head()+`<section class="card"><div class="row2"><div class="ico">${k.e}</div><div><div class="tag">Màn ${S.lv+1}/4 · ${LN[S.lv]}</div><h2>${k.n}</h2></div></div>
 <p>${k.i}</p><p class="mut sm">💡 ${LH[S.lv]}</p>
 <div class="ex"><span class="sm mut">Ví dụ đã được duyệt (${k.y}):</span>${chips(c.r.sample,k)}</div>${c.free.length?`<div class="ex"><span class="sm mut">Quy tắc này rất “hẹp”, khó gặp khi thử ngẫu nhiên nên bạn được xem thêm ví dụ (${k.y}):</span>${c.free.map(t=>chips(t,k)).join(' ')}</div>`:''}${c.hints.map(h=>`<div class="ex"><span class="sm mut">Gợi ý — ví dụ ${h.ok?'được duyệt':'bị từ chối'} (${h.ok?k.y:k.x}):</span>${chips(h.tr,k)}</div>`).join('')}</section>
 <section class="card"><div class="row2 sb"><h3>Thử một bộ ba</h3><div class="pips" title="Số lượt đã dùng">${Array.from({length:MAXT},(_,i)=>`<i class="${i<t.length?'u':''}"></i>`).join('')}</div></div>
 <div class="tiles">${[0,1,2].map(i=>`<label><span>${k.l[i]}</span><input id="n${i}" type="number" inputmode="numeric" min="1" max="30" value="${v[i]}" placeholder="1–30" aria-label="${k.l[i]}"><small>${k.u}</small><div class="st"><button type="button" data-a="step" data-i="${i}" data-d="-1" aria-label="Giảm ${k.l[i]}">−</button><button type="button" data-a="step" data-i="${i}" data-d="1" aria-label="Tăng ${k.l[i]}">+</button></div></label>`).join('')}</div>
 <p class="sm mut">Chọn dự đoán của bạn <b>trước</b> khi biết kết quả:</p>
 <div class="row"><button class="b yes" data-a="try" data-p="1" ${dis}>Tôi đoán: ${k.y}</button><button class="b nob" data-a="try" data-p="0" ${dis}>Tôi đoán: ${k.x}</button></div>
 <p id="err" class="err" role="alert"></p>${verdict}<p class="sm mut">Còn <b>${left}</b>/${MAXT} lượt${left?'':' — hãy chốt quy tắc.'}</p></section>
 <section class="card"><h3>📝 Giả thuyết của bạn</h3><textarea id="note" rows="2" placeholder="Bạn nghĩ quy tắc là gì? Sửa lại sau mỗi lần thử.">${esc(c.note)}</textarea></section>
 ${t.length?`<section class="card"><h3>Lịch sử thử</h3>${t.map((x,i)=>`<div class="h"><span class="mut sm">#${i+1}</span>${chips(x.tr,k)}<span class="${x.res?'okt':'not'}">${x.res?k.y:k.x}</span>${x.sur?'<span title="Kết quả khác dự đoán">⚡</span>':''}</div>`).reverse().join('')}<p class="sm mut">⚡ = kết quả khác với dự đoán của bạn</p></section>`:''}
 <button class="b big" data-a="hint">💡 Xin gợi ý (−3 điểm) · đã dùng ${c.hints.length}/4</button>
 <details class="card"><summary>🧭 Mẹo tìm quy tắc</summary><ul class="sm"><li>Thử cả những bộ ba bạn nghĩ sẽ bị <b>từ chối</b> — cách nhanh nhất để lật đổ một giả thuyết sai.</li><li>Thử số rất nhỏ, rất lớn, hai số bằng nhau, hoặc đảo thứ tự của ví dụ mẫu.</li><li>Mỗi lần chỉ đổi một số để biết số nào quyết định kết quả.</li></ul></details>
 <button class="b pri big" data-a="fin">Chốt quy tắc → làm bài kiểm tra</button>`;
}
function testView(){
 const c=S.cur,k=c.skin,done=c.ans.filter(x=>x!==null).length,left=MAXT-c.tries.length;
 return head()+`<section class="card"><div class="tag">Bài kiểm tra · Màn ${S.lv+1}</div><h2>Chốt quy tắc</h2><p>Với mỗi bộ ba dưới đây, hệ thống sẽ trả lời “${k.y}” hay “${k.x}”?</p>${left?`<button class="b" data-a="back">← Quay lại thử thêm (còn ${left} lượt)</button>`:''}</section>
 ${c.test.map((q,i)=>`<section class="card q"><div class="qn">${i+1}</div>${chips(q.triple,k)}<div class="row"><button class="b yes${c.ans[i]===true?' sel':''}" data-a="ans" data-i="${i}" data-v="1">${k.y}</button><button class="b nob${c.ans[i]===false?' sel':''}" data-a="ans" data-i="${i}" data-v="0">${k.x}</button></div></section>`).join('')}
 <div class="bar"><span id="prog">Đã trả lời ${done}/${c.test.length}</span><button id="sub" class="b pri" data-a="submit" ${done<c.test.length?'disabled':''}>Nộp bài</button></div>`;
}
function resultView(){
 const c=S.cur,k=c.skin,x=S.res[S.res.length-1],st=x.cor>=9?3:x.cor>=7?2:x.cor>=5?1:0;
 return head()+`<section class="card c"><div class="tag">Kết quả màn ${S.lv+1}</div><div class="stars">${[0,1,2].map(i=>`<span class="${i<st?'on':''}" style="--d:${i*.15}s">★</span>`).join('')}</div><h2>${x.cor}/${NT} bộ ba đúng</h2>
 <div class="score"><div><b>${x.cor*10}</b><span>điểm trả lời</span></div><div><b>+${x.ref*2}</b><span>thử bác bỏ (${x.ref}×2)</span></div><div><b>+${MAXT-x.n}</b><span>lượt chưa dùng</span></div>${x.hn?`<div><b>−${x.hn*3}</b><span>gợi ý (${x.hn}×3)</span></div>`:''}<div class="tot"><b>${x.sc}</b><span>tổng màn</span></div></div></section>
 <section class="card"><h3>🔓 Quy tắc thật</h3><p class="rule">${sk(c.r.text,k)}</p><p>${sk(c.r.explain,k)}</p>${c.r.note?`<p class="mut sm">${c.r.note}</p>`:''}${c.note?`<p class="mut sm">Giả thuyết cuối của bạn:</p><p class="pre">${esc(c.note)}</p>`:''}</section>
 <section class="card"><h3>Đối chiếu bài kiểm tra</h3>${c.test.map((q,i)=>{const ok=q.answer===c.ans[i];return `<div class="h ${ok?'rok':'rno'}">${chips(q.triple,k)}<span class="${ok?'okt':'not'}">${ok?'✓ Đúng':'✗ Sai'} · đáp án: ${q.answer?k.y:k.x}</span></div>`}).join('')}</section>
 ${S.pr?`<button class="b pri big" data-a="prac" data-l="${S.lv+1}">Luyện thêm màn này</button><button class="b big" data-a="home">Về trang chính</button>`:`<button class="b pri big" data-a="next">${S.lv===3?'Xem tổng kết →':'Màn tiếp theo →'}</button>`}`;
}
function endView(){
 const tot=S.tot,n=S.res.reduce((a,x)=>a+x.n,0),cf=S.res.reduce((a,x)=>a+x.conf,0),pc=n?Math.round(cf/n*100):0;
 const rk=rankOf(tot);
 const msg=pc>=70?'Phần lớn lượt thử của bạn nhằm xác nhận giả thuyết — đây chính là cái bẫy mà trò chơi muốn bạn nhận ra. Lần sau hãy thử nhiều hơn những bộ ba bạn nghĩ sẽ bị từ chối.':pc<=40?'Bạn chủ động thử cả những trường hợp mình cho là sẽ sai — một thói quen rất tốt của người tư duy phản biện.':'Bạn cân bằng giữa xác nhận và bác bỏ. Hãy thử tăng tỉ lệ các lượt tìm cách bác bỏ giả thuyết của chính mình.';
 return head()+`<section class="card c"><div class="tag">Tổng kết</div><div class="rank">${rk[0]}</div><h2>${tot} điểm · ${rk[1]}</h2>${tot>S.prev?`<p class="okt">🎉 Kỷ lục mới!${S.prev?` (trước đó: ${S.prev})`:''}</p>`:`<p class="mut sm">Điểm cao nhất của bạn: ${S.prev}</p>`}</section>
 <section class="card"><h3>Chi tiết từng màn</h3>${S.res.map((x,i)=>`<div class="h"><span>${x.k.e} <b>Màn ${i+1}</b> · ${x.k.n}</span><span class="mut sm">${x.cor}/${NT} đúng · ${x.n} lượt · ${x.sc} điểm</span><div class="bar2"><i style="width:${Math.round(x.sc/117*100)}%"></i></div></div>`).join('')}</section>
 <section class="card"><h3>🧠 Thói quen thử của bạn</h3><p>Trong ${n} lượt thử, <b>${pc}%</b> là lượt bạn dự đoán “Thỏa” (tìm ví dụ xác nhận) và <b>${100-pc}%</b> là lượt dự đoán “Không thỏa” (chủ động tìm cách bác bỏ).</p><p>${msg}</p>
 <p class="mut sm">Thiên kiến xác nhận là xu hướng chỉ tìm bằng chứng ủng hộ điều mình đang tin. Muốn kiểm chứng một giả thuyết, hãy thử cả những trường hợp mà giả thuyết dự đoán sẽ <i>sai</i>: nếu chúng vẫn “Thỏa”, giả thuyết của bạn đã bị bác bỏ.</p></section>
 <button class="b big" data-a="share">📋 Sao chép kết quả để chia sẻ</button><p id="shr" class="sm mut c"></p>
 <button class="b pri big" data-a="again">Chơi lại với bộ đề mới</button>`;
}
function render(){
 app.innerHTML=({intro:introView,play:playView,test:testView,result:resultView,end:endView})[S.phase]();
 const key=S.phase+S.lv;if(key!==lastKey){lastKey=key;window.scrollTo(0,0)}
 save();
}
function startLevel(){
 const r=S.rules[S.lv];
 S.cur={r,pred:E.buildPredicate(r),skin:S.skins[S.lv],tries:[],hints:[],free:[],note:'',test:null,ans:[]};
 if(r.rate<.05)S.cur.free=pickEx(S.cur,true,2);
 S.phase='play';render();
}
function newGame(){
 const rules=E.pickRules(DATA,seen(),Math.random);
 saveSeen(rules.map(r=>r.id));
 S={phase:'play',lv:0,res:[],rules,skins:E.shuffle(Math.random,SKINS).slice(0,4)};
 startLevel();
}
const act={
 start:newGame,again:newGame,
 try(b){
  const c=S.cur,tr=[0,1,2].map(i=>{const s=$('#n'+i).value.trim();return s===''?NaN:Number(s)}),er=$('#err');
  if(!E.inDomain(tr)){er.textContent='Mỗi ô cần một số nguyên từ 1 đến 30.';return}
  if(c.tries.some(x=>x.tr.join()===tr.join())){er.textContent='Bạn đã thử bộ ba này rồi — hãy thử bộ khác.';return}
  const p=b.dataset.p==='1',res=c.pred(tr);
  c.tries.push({tr,p,res,sur:p!==res});render();
 },
 fin(){
  const c=S.cur;
  if(!c.tries.length){$('#err').textContent='Hãy thử ít nhất một bộ ba trước khi chốt quy tắc.';return}
  c.test=E.makeFinalTest(c.r,Math.random,NT);c.ans=c.test.map(()=>null);S.phase='test';render();
 },
 back(){S.phase='play';render()},
 step(b){const el=$('#n'+b.dataset.i),d=+b.dataset.d,v=el.value===''?(d>0?0:31):Math.round(+el.value);el.value=Math.min(30,Math.max(1,v+d))},
 hint(){
  const c=S.cur;if(c.hints.length>=4)return;
  const ok=c.hints.length%2===0,t=pickEx(c,ok,1)[0];
  if(!t)return;
  c.hints.push({ok,tr:t});render();
 },
 share(){
  const r=rankOf(S.tot),t=`Luật Ẩn 🔎 — ${S.tot} điểm ${r[0]} ${r[1]}. ${S.res.map((x,i)=>`Màn ${i+1}: ${x.cor}/${NT}`).join(' · ')}. Bạn có tìm ra quy tắc ẩn nhanh hơn mình không?`,o=$('#shr');
  const fb=()=>{o.innerHTML=`<textarea readonly rows="3" id="shrt">${esc(t)}</textarea>`;try{$('#shrt').select()}catch(e){}};
  try{navigator.clipboard.writeText(t).then(()=>{o.textContent='✓ Đã sao chép kết quả!'},fb)}catch(e){fb()}
 },
 resume(){if(!load())newGame()},
 prac(b){const L=+b.dataset.l,rules=E.pickRules(DATA,seen(),Math.random);saveSeen([rules[L-1].id]);S={phase:'play',lv:L-1,res:[],rules,skins:E.shuffle(Math.random,SKINS).slice(0,4),pr:1};startLevel()},
 home(){S={phase:'intro',lv:0,res:[]};render()},
 ans(b){
  const c=S.cur;c.ans[+b.dataset.i]=b.dataset.v==='1';
  b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x===b));
  const n=c.ans.filter(x=>x!==null).length;
  $('#prog').textContent=`Đã trả lời ${n}/${c.test.length}`;$('#sub').disabled=n<c.test.length;save();
 },
 submit(){
  const c=S.cur,cor=c.test.filter((q,i)=>q.answer===c.ans[i]).length;
  const sur=c.tries.filter(x=>x.sur).length,conf=c.tries.filter(x=>x.p).length;
  const ref=Math.min(c.tries.filter(x=>!x.p).length,3),hn=c.hints.length;
  S.res.push({r:c.r,k:c.skin,cor,sur,conf,ref,hn,n:c.tries.length,sc:Math.max(0,cor*10+ref*2+(MAXT-c.tries.length)-hn*3)});
  if(S.pr){const x=S.res[S.res.length-1];window.SoftSyncGameHistory?.append('luat-an',{title:`Luật Ẩn · Màn ${S.lv+1}`,score:x.sc,unit:'điểm',summary:`${x.cor}/${NT} bộ ba đúng`,metrics:[{label:'Lượt thử',value:x.n},{label:'Gợi ý',value:x.hn},{label:'Thử bác bỏ',value:x.ref}],details:[`Màn ${S.lv+1}: ${x.cor}/${NT} đúng · ${x.n} lượt · ${x.sc} điểm`]},'softsync.luat-an.history.v1')}
  S.phase='result';render();
 },
 next(){
  S.lv++;
  if(S.lv>3){S.tot=S.res.reduce((a,x)=>a+x.sc,0);S.prev=best();if(S.tot>S.prev)setBest(S.tot);S.phase='end';window.SoftSyncGameHistory?.append('luat-an',{title:'Luật Ẩn · Chiến dịch',score:S.tot,unit:'điểm',summary:rankOf(S.tot)[1],metrics:[{label:'Số màn',value:S.res.length},{label:'Lượt thử',value:S.res.reduce((a,x)=>a+x.n,0)},{label:'Đúng',value:S.res.reduce((a,x)=>a+x.cor,0)}],details:S.res.map((x,i)=>`Màn ${i+1}: ${x.cor}/${NT} đúng · ${x.n} lượt · ${x.sc} điểm`)},'softsync.luat-an.history.v1');render()}
  else startLevel();
 }
};
app.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled)act[b.dataset.a](b)});
app.addEventListener('input',e=>{
 const t=e.target;if(t.id==='note'&&S.cur){S.cur.note=t.value;save()}
 if(/^n[01]$/.test(t.id)){const v=t.value;if(v.length>=2||(v.length===1&&+v>3)){const nx=$('#n'+(+t.id[1]+1));if(nx)nx.focus()}}
});
app.addEventListener('focusin',e=>{if(e.target.matches&&e.target.matches('.tiles input')){try{e.target.select()}catch(x){}}});
app.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&/^n[0-2]$/.test(e.target.id)){const i=+e.target.id[1];if(i<2)$('#n'+(i+1)).focus();else e.target.blur()}
});
render();
window.SoftSyncGameHistory?.mount({gameKey:'luat-an',storageKey:'softsync.luat-an.history.v1',title:'Luật Ẩn'});
</script>
</body>
