<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fc">
  <title>Eisenhower Matrix · SoftSync</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="/games/history-sync.css">
</head>
<body>
  <main>
    <a class="back-link" href="/game"><span aria-hidden="true">←</span> Quay lại Mini Game</a>
    <header class="hero">
      <span class="eyebrow">SOFT SKILLS · QUẢN LÝ THỜI GIAN</span>
      <div class="hero-row">
        <div>
          <h1>Eisenhower Matrix</h1>
          <p>Sắp xếp việc cần làm theo mức độ khẩn cấp và quan trọng.</p>
        </div>
        <div class="meta" id="meta" aria-live="polite"></div>
      </div>
      <details>
        <summary>Cách chơi</summary>
        <p>Mỗi tình huống có bốn nhiệm vụ. Chạm một nhiệm vụ rồi chọn ô phù hợp, hoặc kéo nhiệm vụ vào ô. Xếp đủ bốn việc để kiểm tra câu trả lời và xem giải thích.</p>
      </details>
    </header>
    <div id="app"></div>
  </main>
  <section id="game-history"></section>
  <script src="/games/history-sync.js"></script>
  <script src="data.js"></script>
  <script src="game.js"></script>
</body>
</html>
